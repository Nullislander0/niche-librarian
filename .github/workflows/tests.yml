name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Vector search available (sqlite-vec loads)
        run: python -c "from engine.index.store import Store, sqlite; s = Store(':memory:', 768); assert s.vec_ok, 'sqlite-vec did not load'; print(sqlite.__name__, sqlite.sqlite_version, s.db.execute('select vec_version()').fetchone()[0])"
      - name: Tests
        run: python -m pytest -q
      - name: Tests through sqlean.py (the binding macOS uses), on Linux too
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install "sqlean.py>=3.45"
          LIBRARIAN_SQLITE=sqlean python -m pytest -q
