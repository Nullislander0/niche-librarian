# Query expansion for keyword search. Measured with `librarian eval` (2026-11-04):
# expanding common words into long phrases hurt recall, so most entries are one-way.
#   "a, b -> c"   a or b in the query also searches c (one-way)
#   [a, b]        either term also searches the other (two-way; only for rare, equal terms)
groups:
  - "webadaptor, web adapter -> web adaptor"
  - "ags -> arcgis server"
  - "portal for arcgis -> arcgis enterprise portal"
  - "arcgis enterprise portal -> portal for arcgis"
  - "egdb, arcsde, sde geodatabase -> enterprise geodatabase"
  - "datastore -> data store"
  - [relational data store, relational store]
  - "tilecache -> tile cache data store"
  - "bds, spatiotemporal data store -> spatiotemporal big data store"
  - "object data store -> object store"
  - "hosted feature service -> hosted feature layer"
  - "ca-signed certificate, tls certificate, https certificate -> ssl certificate"
  - "self signed certificate -> self-signed certificate"
  - "ha -> high availability"
  - "web gis dr -> webgisdr"
  - "base deployment, enterprise builder -> arcgis enterprise builder"
  - "portaladmin, portal admin api -> portal administrator directory"
  - "arcgis/admin -> arcgis server administrator directory"
  - "k8s -> kubernetes"
  - "idp, enterprise logins -> saml"
  - "iwa -> integrated windows authentication"
  - "notebook server -> arcgis notebook server"
  - "geoevent -> geoevent server"
  - "raster analytics -> image server"
  - "mapserver -> map service"
  - "featureserver -> feature service"
  - "arcmap -> arcgis desktop"
  - "internet information services -> iis"
  - "sd file, sddraft -> service definition"
  - "soe -> server object extension"
  - "soi -> server object interceptor"
