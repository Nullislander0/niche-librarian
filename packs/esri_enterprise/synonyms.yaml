# Equivalent terms for keyword search. If any term in a group appears in a query, the
# others are added as alternatives. Covers renames, abbreviations and common spellings.
# Avoid very short ambiguous tokens (e.g. "ad", "wa") - they fire on unrelated words.
groups:
  - [web adaptor, webadaptor, web adapter]
  - [arcgis server, ags]
  - [portal for arcgis, arcgis enterprise portal, portal]
  - [enterprise geodatabase, egdb, arcsde, sde geodatabase, sde]
  - [arcgis data store, data store, datastore]
  - [relational data store, relational store]
  - [tile cache data store, tilecache]
  - [spatiotemporal big data store, spatiotemporal data store, bds]
  - [object store, object data store]
  - [hosted feature layer, hosted feature service, hosted layer]
  - [federation, federate, federated server]
  - [ca-signed certificate, ssl certificate, tls certificate, https certificate]
  - [self-signed certificate, self signed certificate]
  - [high availability, ha]
  - [disaster recovery, webgisdr, web gis dr]
  - [arcgis enterprise builder, enterprise builder, base deployment, base arcgis enterprise deployment]
  - [arcgis server manager, server manager]
  - [portal administrator directory, portaladmin, portal admin api]
  - [arcgis server administrator directory, server admin, arcgis/admin]
  - [arcgis enterprise on kubernetes, enterprise on kubernetes, k8s]
  - [saml, enterprise logins, identity provider, idp]
  - [integrated windows authentication, iwa, windows authentication]
  - [active directory, ldap]
  - [arcgis notebook server, notebook server]
  - [arcgis geoevent server, geoevent server, geoevent]
  - [arcgis image server, image server, raster analytics]
  - [arcgis monitor, monitor server]
  - [map service, mapserver, map image layer]
  - [feature service, featureserver, feature layer]
  - [arcmap, arcgis desktop]
  - [iis, internet information services]
  - [service definition, sd file, sddraft]
  - [arcgis enterprise sdk, server object extension, soe, soi, server object interceptor]
