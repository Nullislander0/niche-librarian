# Esri ArcGIS Enterprise pack: architecture, administration, and practitioner experience.
name: Esri ArcGIS Enterprise
description: >-
  ArcGIS Enterprise (Portal, Server, Data Store, Web Adaptor, enterprise geodatabases):
  architecture, installation, upgrades, administration and troubleshooting, mostly from
  practitioner Q&A.

# Shown to agents in the MCP tool descriptions.
agent:
  good_queries:
    - "webgisdr backup fails unable to generate token 11.3"
    - "federate ArcGIS Server with Portal certificate error"
    - "Data Store upgrade 11.5 to 12.1 validation fails"
  bad_queries:
    - "portal"                                       # too vague
    - "upgrade, federation, SSL and backups in 11.x" # several topics: one call per topic

# Optional crawler overrides (defaults live in engine/config.py).
# crawler:
#   min_interval_seconds: 1.0

sources:
  - id: gis_se
    parser: stackexchange
    source_type: forum
    trust: 0.7
    options:
      site: gis
      site_url: https://gis.stackexchange.com
      fetch_author_profiles: true
      quota_reserve: 25
      # Crawled tier by tier, tag by tag. Tier 1 is Enterprise-specific; later tiers are broader
      # and noisier. A question with several tags is fetched once per tag but indexed once.
      # Tag counts checked 2026-11-04.
      tag_tiers:
        - tier: 1
          tags: [arcgis-enterprise, arcgis-portal, arcgis-web-adaptor, arcgis-data-store]  # 87, 249, 20, 2
        - tier: 2
          tags: [arcgis-server]           # 2749
        - tier: 3
          tags: [enterprise-geodatabase]  # 1478
        - tier: 4   # admin automation and server extensions (added 2026-11-04)
          tags: [arcgis-rest-api, arcgis-python-api, arcgis-license-manager,  # 374, 185, 97
                 arcgis-notebook, server-object-extension, arcgis-image-server]  # 45, 38, 14

  - id: esri_community
    parser: vanilla
    source_type: forum
    trust: 0.8
    options:
      base_url: https://community.esri.com
      page_size: 500
      revisit_days: 30
      redirect_param: target          # links arrive as /home/leaving?target=<url>
      staff_label_pattern: '^\s*Esri\b'   # user labels like "Esri Notable", "Esri Contributor"
      expert_label_pattern: '\bMVP\b'
      # Category IDs from /api/v2/categories (discussion counts checked 2026-11-04).
      category_tiers:
        - tier: 1   # ArcGIS Enterprise boards
          categories:
            - {id: 739, name: Enterprise questions}  # 9,916
            - {id: 1440, name: Enterprise Portal}  # 4,335
            - {id: 1745, name: High availability / disaster recovery}  # 173
            - {id: 2074, name: Publishing and managing services}  # 382
            - {id: 734, name: Enterprise in the cloud}  # 257
            - {id: 736, name: Extensibility questions}  # 135
            - {id: 733, name: Enterprise blog}  # 98
            - {id: 735, name: Enterprise documentation feedback}  # 39
            - {id: 170, name: Software security and privacy}  # 66: patches, CVEs, hardening
        - tier: 2   # adjacent products
          categories:
            - {id: 1635, name: Geodatabase questions}  # 2,071
            - {id: 79, name: ArcGIS Monitor}  # 1,000
            - {id: 1030, name: ArcGIS REST API questions}  # 1,821
        - tier: 3
          categories:
            - {id: 737, name: Enterprise ideas}  # 1,523: feature requests, useful for "is this supported?"
        - tier: 4   # server roles and apps deployed on Enterprise (added 2026-11-04)
          categories:
            - {id: 68, name: GeoEvent Server}  # 1,469
            - {id: 4, name: Image Server}  # 504
            - {id: 100, name: Workflow Manager}  # 782
            - {id: 82, name: ArcGIS Notebooks}  # 316
            - {id: 67, name: GeoAnalytics Server}  # 74
        - tier: 5   # broader, noisier
          categories:
            - {id: 157, name: ArcGIS API for Python}  # 2,913: admin automation
            - {id: 96, name: Utility Network}  # 1,628
            - {id: 2572, name: Utility Network articles}  # 60

  - id: esri_docs
    parser: sitemap_html
    source_type: docs
    trust: 1.0
    options:
      # doc.esri.com only publishes the current release (12.1 as of 2026-11-04).
      # Older versioned docs (11.x, 10.9.1) live on enterprise.arcgis.com without a usable sitemap.
      sitemaps:
        - https://doc.esri.com/en/arcgis-enterprise/12.1/sitemap.xml          # ~1,230 pages
        - https://doc.esri.com/en/arcgis-enterprise-k8s/12.1/sitemap.xml      # ~836 pages
        - https://doc.esri.com/en/arcgis-enterprise-cloud-tools/12.1/sitemap.xml  # ~132 pages
      include: ['^https://doc\.esri\.com/en/']
      content: {tag: article, id: main}
      title_strip: '\s*\|[^|]*documentation\s*$'
      version_meta: version
      date_meta: last-modified
      refresh_days: 30
      kind: page

  - id: esri_kb
    parser: sitemap_html
    source_type: kb
    trust: 0.95
    options:
      # Esri technical support articles (error messages, causes, fixes). The sitemap lists
      # ~7,900 articles for every product; all are read once (kept in the raw cache) and
      # only those whose <meta name="product"> matches below are indexed.
      sitemaps: [https://support.esri.com/en-us/knowledge-base/sitemap-articles.xml]
      include: ['^https://support\.esri\.com/en-us/knowledge-base/']
      content: {tag: div, class: leftcontent}
      title_strip: '\s*[|-]\s*Esri Support.*$'
      date_meta: last-modified
      meta_filter:
        product: 'ArcGIS Enterprise|Portal for ArcGIS|ArcGIS Server|Data Store|Web Adaptor|ArcGIS Monitor|GeoEvent|Image Server|Notebook Server|Workflow Manager|Geodatabase|ArcSDE|GeoAnalytics Server|Utility Network|API for Python|REST API|Enterprise SDK'
      extra_meta: [product, article-type, article-number]
      refresh_days: 60
      kind: article

  - id: esri_bugs
    parser: sitemap_html
    source_type: bug
    trust: 0.95
    options:
      # Esri's public bug database: ~390k records for every product. Only newer records
      # (BUG-000120000+, roughly 2019 onward) whose URL slug names an Enterprise component
      # are fetched (~11.7k, newest first); then <meta name="product"> must match too.
      sitemaps: [https://support.esri.com/en-us/bugs/sitemap-bugs.xml]
      include:
        - '^https://support\.esri\.com/en-us/bug/(?=[^/]*(portal|arcgis-server|arcgis-enterprise|enterprise-|data-store|datastore|web-adaptor|federat|webgisdr|kubernetes|server-manager|geoevent|image-server|notebook-server|arcgis-monitor|workflow-manager|enterprise-geodatabase|hosted-feature))[^/]*-bug-0001[2-9]\d{4}$'
      sort: {pattern: '-bug-0*(\d+)$', descending: true}
      content: {tag: div, class: leftcontent}
      title_strip: '\s+for\s+.*$'
      title_format: '{title}: {h1}'
      version_meta: version
      date_meta: last-modified
      meta_filter:
        product: 'ArcGIS Enterprise|Portal for ArcGIS|ArcGIS Server|Data Store|Web Adaptor|ArcGIS Monitor|GeoEvent|Image Server|Notebook Server|Workflow Manager|Geodatabase|GeoAnalytics Server'
      extra_meta: [product, status, version]
      extract: {version_fixed: 'Version Fixed\s*\|\s*([^|\n]+?)\s*\|'}
      versions_from: [version_fixed]
      refresh_days: 30
      kind: bug

  # Planned (not yet implemented):
  #   esri_docs_11x   - 11.x / 10.9.1 docs on enterprise.arcgis.com (needs TOC link-following)
  #   github          - Esri org issues/discussions via the GitHub API
  #   reddit          - r/gis via the official API (supplemental)
