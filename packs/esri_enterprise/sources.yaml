# Esri ArcGIS Enterprise pack: architecture, administration, and practitioner experience.
name: Esri ArcGIS Enterprise
description: >-
  ArcGIS Enterprise (Portal, Server, Data Store, Web Adaptor, enterprise geodatabases):
  architecture, installation, upgrades, administration and troubleshooting, mostly from
  practitioner Q&A.

# Optional crawler overrides (defaults live in engine/config.py).
# crawler:
#   min_interval_seconds: 1.0

sources:
  - id: gis_se
    parser: stackexchange
    source_type: forum
    trust: 0.7
    options:
      site: gis
      site_url: https://gis.stackexchange.com
      fetch_author_profiles: true
      quota_reserve: 25
      # Crawled tier by tier, tag by tag. Tier 1 is Enterprise-specific; later tiers are broader
      # and noisier. A question with several tags is fetched once per tag but indexed once.
      # Tag counts checked 2026-11-04.
      tag_tiers:
        - tier: 1
          tags: [arcgis-enterprise, arcgis-portal, arcgis-web-adaptor, arcgis-data-store]  # 87, 249, 20, 2
        - tier: 2
          tags: [arcgis-server]           # 2749
        - tier: 3
          tags: [enterprise-geodatabase]  # 1478

  - id: esri_community
    parser: vanilla
    source_type: forum
    trust: 0.8
    options:
      base_url: https://community.esri.com
      page_size: 500
      revisit_days: 30
      redirect_param: target          # links arrive as /home/leaving?target=<url>
      staff_label_pattern: '^\s*Esri\b'   # user labels like "Esri Notable", "Esri Contributor"
      expert_label_pattern: '\bMVP\b'
      # Category IDs from /api/v2/categories (discussion counts checked 2026-11-04).
      category_tiers:
        - tier: 1   # ArcGIS Enterprise boards
          categories:
            - {id: 739, name: Enterprise questions}  # 9,916
            - {id: 1440, name: Enterprise Portal}  # 4,335
            - {id: 1745, name: High availability / disaster recovery}  # 173
            - {id: 2074, name: Publishing and managing services}  # 382
            - {id: 734, name: Enterprise in the cloud}  # 257
            - {id: 736, name: Extensibility questions}  # 135
            - {id: 733, name: Enterprise blog}  # 98
            - {id: 735, name: Enterprise documentation feedback}  # 39
        - tier: 2   # adjacent products
          categories:
            - {id: 1635, name: Geodatabase questions}  # 2,071
            - {id: 79, name: ArcGIS Monitor}  # 1,000
            - {id: 1030, name: ArcGIS REST API questions}  # 1,821
        - tier: 3
          categories:
            - {id: 737, name: Enterprise ideas}  # 1,523: feature requests, useful for "is this supported?"

  # Planned (not yet implemented):
  #   esri_docs       - enterprise.arcgis.com docs, release notes, compatibility matrices
  #   github          - Esri org issues/discussions via the GitHub API
  #   reddit          - r/gis via the official API (supplemental)
