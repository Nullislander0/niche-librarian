[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niche-librarian"
version = "0.1.0"
description = "A local, targeted search index for AI agents, exposed over MCP."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "sqlite-vec>=0.1.6",
    # macOS Pythons (python.org, Apple, GitHub Actions) can't load SQLite extensions; this
    # drop-in SQLite build can, so semantic search works there too.
    "sqlean.py>=3.45; sys_platform == 'darwin'",
    "mcp>=2.0",
    "jeepney>=0.8; sys_platform == 'linux'",  # D-Bus: keep the Linux desktop awake during long jobs
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rerank = ["fastembed>=0.9"]  # optional cross-encoder rerank stage (ONNX Runtime, no PyTorch)

[project.scripts]
librarian = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
