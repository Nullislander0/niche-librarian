[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niche-librarian"
version = "0.1.0"
description = "A local, targeted search index for AI agents, exposed over MCP."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "sqlite-vec>=0.1.6",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
librarian = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
